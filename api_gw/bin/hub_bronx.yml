# hub 进程的 bronx 框架配置, 业务配置见 hub.yml。
# 日志平铺在 logs/ 下, 文件名带 hub_ 前缀, 和 gw 的 gw_ 前缀区分, 两进程同跑不撞。
# logs/ 目录需提前建好, 或把 file 改成绝对路径。

cpu_pool:
  threads: 2
  max_queue: 0
  name: hub-cpu

fiber:
  stack_size: 131072
  stack_pool_size: 8
  guard_page: 1

tcp:
  connect:
    timeout: 5000

tcp_server:
  recv_timeout: 120000

logs:
  - name: root
    level: info
    appenders:
      - type: BxStdoutLogAppender
        async: false
      - type: BxFileLogAppender
        file: logs/hub_root.log
        async: true
  - name: system
    level: info
    appenders:
      - type: BxStdoutLogAppender
        async: false
      - type: BxFileLogAppender
        file: logs/hub_system.log
        async: true
  - name: hub
    level: info
    appenders:
      - type: BxStdoutLogAppender
        async: false
      - type: BxFileLogAppender
        file: logs/hub.log
        async: true
