
/home/bronx/remote/bx_main/logs/*.log {
    # 单文件超 50M 就轮转
    size 50M
    # 保留 7 个历史 (.1 ~ .7)
    rotate 7
    # 文件不存在不报错
    missingok
    # 空文件不轮转
    notifempty
    # 历史文件 gzip 压缩
    compress
    # 最近的 .1 先不压, 下轮再压 (避开进程可能还往 .1 写的窗口)
    delaycompress
    # 建新文件的权限与属主, 与原文件一致
    create 0664 bronx bronx
}
