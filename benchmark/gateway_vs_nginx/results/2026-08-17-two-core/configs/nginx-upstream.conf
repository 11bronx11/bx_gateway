worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log error;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    access_log off;
    keepalive_timeout 65s;
    server_tokens off;

    server {
        listen 127.0.0.1:18080 backlog=4096;
        location /bench {
            default_type application/json;
            return 200 '{"ok":true,"source":"bench"}\n';
        }
    }
}
