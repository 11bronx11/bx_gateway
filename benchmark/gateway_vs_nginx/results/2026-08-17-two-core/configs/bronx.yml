cpu_pool:
  threads: 2
  max_queue: 0
  name: cpu

fiber:
  stack_size: 131072
  stack_pool_size: 64
  guard_page: 1

tcp:
  connect:
    timeout: 1000

tcp_server:
  recv_timeout: 30000

logs:
  - name: root
    level: fatal
    appenders:
      - type: BxFileLogAppender
        file: logs/bench_root.log
        async: true
  - name: system
    level: fatal
    appenders:
      - type: BxFileLogAppender
        file: logs/bench_system.log
        async: true
  - name: gw
    level: fatal
    appenders:
      - type: BxFileLogAppender
        file: logs/bench_access.log
        async: true
  - name: trace
    level: fatal
    appenders:
      - type: BxFileLogAppender
        file: logs/bench_trace.log
        async: true
