auth_enabled: false

server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3100

common:
  path_prefix: /home/bronx/remote/bx_main/demo/run/loki-data
  storage:
    filesystem:
      chunks_directory: /home/bronx/remote/bx_main/demo/run/loki-data/chunks
      rules_directory: /home/bronx/remote/bx_main/demo/run/loki-data/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

analytics:
  reporting_enabled: false
