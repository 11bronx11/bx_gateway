apiVersion: 1

datasources:
  - name: Bronx Prometheus
    uid: bronx-prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9099
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 2s

  - name: Bronx Loki
    uid: bronx-loki
    type: loki
    access: proxy
    url: http://127.0.0.1:3100
    editable: true
    jsonData:
      maxLines: 1000
