worker_processes 2;
error_log  /home/bronx/remote/bx_main/demo/run/nginx_error.log warn;
pid        /home/bronx/remote/bx_main/demo/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format bronx_demo escape=json
        '{"ts":"$time_iso8601","request_id":"$request_id",'
        '"remote_addr":"$remote_addr","method":"$request_method",'
        '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"http":"$server_protocol","latency_s":$request_time,'
        '"upstream":"$upstream_addr","upstream_status":"$upstream_status"}';
    access_log /home/bronx/remote/bx_main/demo/run/nginx_access.log bronx_demo;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name gw.local localhost;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name gw.local localhost;

        ssl_certificate     /home/bronx/remote/bx_main/demo/nginx/ca/server.crt;
        ssl_certificate_key /home/bronx/remote/bx_main/demo/nginx/ca/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        location / {
            proxy_pass http://127.0.0.1:8090;
            proxy_http_version 1.1;

            proxy_set_header X-Request-Id      $request_id;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Host              $host;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_buffering off;

            proxy_connect_timeout 5s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;
        }
    }
}
